# Redeploys Everstats on its host on every push to main. Copied from next-up's deploy.yml (itself from
# home-dashboard); the runner, Gitea and its settings are used as they are.
#
# Host-specific values are Gitea Actions variables (repo Settings → Actions → Variables), never written here:
#   DEPLOY_DIR          absolute path of the host checkout that docker compose runs in
#   INTERNAL_GIT_URL    Gitea's base URL as job containers can reach it (no trailing slash)
#   BIND_IP             host address the ports are published on (docker-compose.yml) and probed at
#   PG_DATA_DIR         host folder for Postgres's main data (direct pool/disk path, never /mnt/user)
#   PG_SNAPSHOT_DIR     host folder for the snapshots tablespace (array disk path, never /mnt/user)
#   BACKUP_DIR          host folder for the worker's nightly pg_dump archives (mounted at /backups; a /mnt/user share
#                       is fine here), owned by 1000:1000
# Optional: WEB_PORT / WORKER_PORT (default 3260 / 3261, the same defaults as docker-compose.yml).
# Preflight fails if a required one is unset, before anything is stopped.
#
# How it reaches the host: the job container can see the host's Docker daemon (the runner passes its mounted
# /var/run/docker.sock into job containers), but NOT the host's filesystem. So every step that touches the deployment
# launches a short-lived helper container through that daemon and bind-mounts the host path into it. The deploy dir
# is mounted at the SAME path inside the helpers, so compose's relative paths resolve to the real host paths.
#
# Hard constraints:
#   - never create, overwrite or modify .env (the workflow checks its hash before and after)
#   - never touch the database folders beyond checking they exist
#   - never `git reset --hard` / `git clean`; fast-forward only (a host checkout with local edits stops the deploy
#     instead of silently losing them)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
  INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
  BIND_IP: ${{ vars.BIND_IP }}
  PG_DATA_DIR: ${{ vars.PG_DATA_DIR }}
  PG_SNAPSHOT_DIR: ${{ vars.PG_SNAPSHOT_DIR }}
  BACKUP_DIR: ${{ vars.BACKUP_DIR }}
  WEB_PORT: ${{ vars.WEB_PORT || '3260' }}
  WORKER_PORT: ${{ vars.WORKER_PORT || '3261' }}
  WEB_CONTAINER: everstats
  WORKER_CONTAINER: everstats-worker
  DB_CONTAINER: everstats-db
  APP_IMAGE: everstats:local
  GIT_IMAGE: alpine/git:latest
  DOCKER_IMAGE: docker:cli

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: docker:cli
    defaults:
      run:
        shell: sh
    timeout-minutes: 20
    steps:
      - name: Preflight — variables, host Docker daemon, deploy dir and database folders
        run: |
          set -eu
          unset_vars=""
          for v in DEPLOY_DIR INTERNAL_GIT_URL BIND_IP PG_DATA_DIR PG_SNAPSHOT_DIR BACKUP_DIR; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || unset_vars="$unset_vars $v"
          done
          if [ -n "$unset_vars" ]; then
            echo "::error::Missing Gitea Actions variables:$unset_vars. Add them in repo Settings → Actions → Variables."
            exit 1
          fi
          case "$PG_DATA_DIR$PG_SNAPSHOT_DIR" in
            */mnt/user/*) echo "::error::PG_DATA_DIR and PG_SNAPSHOT_DIR must not be under /mnt/user (shfs). Use a /mnt/cache or /mnt/diskN path."; exit 1 ;;
          esac

          if ! docker version >/dev/null 2>&1; then
            echo "::error::No Docker daemon reachable from the job container."
            echo "The runner must pass its docker.sock into job containers."
            echo "In act_runner's config.yaml, container.docker_host must be empty or 'automount', not '-'."
            exit 1
          fi
          echo "Docker daemon: $(docker info --format '{{.Name}} / {{.ServerVersion}}')"

          # --mount (unlike -v) FAILS if the host path does not exist instead of silently creating an empty directory.
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c '
              set -eu
              missing=0
              for f in .git docker-compose.yml Dockerfile .env; do
                if [ ! -e "$f" ]; then echo "::error::$PWD/$f not found on host"; missing=1; fi
              done
              [ "$missing" = 0 ] || exit 1
              grep -q "^EVERSTATS_ROOT_KEY=." .env || { echo "::error::EVERSTATS_ROOT_KEY is not set in .env"; exit 1; }
              grep -q "^POSTGRES_PASSWORD=." .env || { echo "::error::POSTGRES_PASSWORD is not set in .env"; exit 1; }
              echo "Host deploy dir OK: $PWD"
            '

          # The database folders compose mounts. Checked here, before compose stops anything: if one is missing, `up`
          # would fail after taking the running site down.
          for d in "$PG_DATA_DIR" "$PG_SNAPSHOT_DIR"; do
            docker run --rm --mount "type=bind,source=$d,target=/check,readonly" --entrypoint sh "$GIT_IMAGE" -c 'test -d /check' \
              || { echo "::error::$d not found on host. Create it, owned by 999:999, before deploying."; exit 1; }
            echo "Database folder OK: $d"
          done

          # The backup folder docker-compose.yml mounts into the worker. It must exist (Docker never creates it) and be
          # writable by uid 1000, the image's node user: a backup folder the worker can't write is a backup that never
          # happens. The probe file is removed at once.
          docker run --rm --user 1000:1000 --mount "type=bind,source=$BACKUP_DIR,target=/backups" --entrypoint sh "$GIT_IMAGE" \
            -c 'touch /backups/.deploy-write-check && rm /backups/.deploy-write-check' \
            || { echo "::error::$BACKUP_DIR must exist on the host and be writable by uid 1000 (chown 1000:1000 it) before deploying."; exit 1; }
          echo "Backup folder OK: $BACKUP_DIR"

      - name: Record .env fingerprint
        run: |
          set -eu
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c 'sha256sum .env | cut -d" " -f1' > /tmp/env.sha
          echo "Recorded .env fingerprint."

      - name: Pull latest main into host working copy (fast-forward only)
        env:
          GIT_TOKEN: ${{ gitea.token }}
          REPO_PATH: ${{ gitea.repository }}
          PUSHED_SHA: ${{ gitea.sha }}
        run: |
          set -eu
          # Fetch from Gitea's internal address explicitly: the host can't resolve tailnet names. The token travels
          # in an env var and an http header, never in argv or .git/config.
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR" \
            -w "$DEPLOY_DIR" \
            -e GIT_TOKEN -e REPO_PATH -e PUSHED_SHA -e INTERNAL_GIT_URL \
            --entrypoint sh "$GIT_IMAGE" -c '
              set -eu
              git config --global --add safe.directory "$PWD"
              auth="Authorization: Basic $(printf "x-access-token:%s" "$GIT_TOKEN" | base64 | tr -d "\n")"

              branch=$(git rev-parse --abbrev-ref HEAD)
              if [ "$branch" != "main" ]; then
                echo "::error::Host working copy is on branch \"$branch\", expected main. Refusing to deploy."
                exit 1
              fi
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "::error::Host working copy has local modifications to tracked files. Refusing to deploy:"
                git status --short --untracked-files=no
                exit 1
              fi

              before=$(git rev-parse HEAD)
              git -c http.extraHeader="$auth" fetch --no-tags "$INTERNAL_GIT_URL/$REPO_PATH.git" main
              git merge --ff-only FETCH_HEAD
              if git remote get-url origin >/dev/null 2>&1; then
                git update-ref refs/remotes/origin/main FETCH_HEAD
              fi
              after=$(git rev-parse HEAD)

              echo "Deployed commit: $before -> $after"
              if [ "$after" != "$PUSHED_SHA" ]; then
                echo "::warning::HEAD ($after) differs from the pushed commit ($PUSHED_SHA). A newer push is probably on main already."
              fi
            '

      - name: Rebuild and restart stack
        run: |
          set -eu
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR" \
            --mount "type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock" \
            -e BIND_IP -e PG_DATA_DIR -e PG_SNAPSHOT_DIR -e BACKUP_DIR -e WEB_PORT -e WORKER_PORT \
            -w "$DEPLOY_DIR" "$DOCKER_IMAGE" \
            docker compose up -d --build

      - name: Verify every service is healthy, stable and on the new version
        run: |
          set -eu
          web="http://$BIND_IP:$WEB_PORT"
          worker="http://$BIND_IP:$WORKER_PORT"
          # Probes run in a helper on the HOST network, so they reach the ports exactly where they are published.
          probe() {
            docker run --rm --network host "$DOCKER_IMAGE" \
              sh -c "wget -q -S -O /dev/null '$1' 2>&1 | grep -q 'HTTP/1.1 200'"
          }
          running() {
            [ "$(docker inspect -f '{{.State.Running}} {{.State.Restarting}}' "$1" 2>/dev/null)" = "true false" ]
          }
          db_healthy() {
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null)" = "healthy" ]
          }

          ok=0
          for i in $(seq 1 40); do
            web_health=fail; web_ui=fail; worker_health=fail; db=fail
            probe "$web/api/health" && web_health=ok || true
            probe "$web/" && web_ui=ok || true
            probe "$worker/api/health" && worker_health=ok || true
            db_healthy && db=ok || true
            echo "attempt $i: web /api/health=$web_health  web /=$web_ui  worker /api/health=$worker_health  db=$db"
            if [ "$web_health$web_ui$worker_health$db" = okokokok ] && running "$WEB_CONTAINER" && running "$WORKER_CONTAINER" && running "$DB_CONTAINER"; then
              ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::Services did not become healthy within ~2 minutes."; exit 1; }

          # Catch crash loops that answer once and then die: every restart count must stay flat.
          counts() { for c in "$WEB_CONTAINER" "$WORKER_CONTAINER" "$DB_CONTAINER"; do printf '%s ' "$(docker inspect -f '{{.RestartCount}}' "$c")"; done; }
          r1=$(counts)
          sleep 15
          r2=$(counts)
          if [ "$r1" != "$r2" ] || ! running "$WEB_CONTAINER" || ! running "$WORKER_CONTAINER" || ! running "$DB_CONTAINER"; then
            echo "::error::A container restarted after coming up (restart counts $r1-> $r2). Likely a crash loop."
            exit 1
          fi
          probe "$web/api/health" || { echo "::error::web stopped responding"; exit 1; }
          probe "$worker/api/health" || { echo "::error::worker stopped responding"; exit 1; }

          # Both app containers must report the version in the CHANGELOG.json that was just pulled: anything else means
          # an old container is still answering.
          expected=$(docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR/CHANGELOG.json,target=/c.json,readonly" \
            --entrypoint node "$APP_IMAGE" -p "JSON.parse(require('fs').readFileSync('/c.json','utf8')).releases[0].version")
          for url in "$web/api/health" "$worker/api/health"; do
            body=$(docker run --rm --network host "$DOCKER_IMAGE" wget -q -O - "$url")
            case "$body" in
              *"\"version\":\"$expected\""*) echo "$url reports $expected" ;;
              *) echo "::error::$url answered $body, expected version $expected."; exit 1 ;;
            esac
          done
          echo "Deployed Everstats $expected: web, worker and database healthy and stable."

      - name: Confirm .env untouched
        if: always()
        run: |
          set -eu
          [ -s /tmp/env.sha ] || { echo "No fingerprint recorded (earlier step failed); skipping."; exit 0; }
          now=$(docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c 'sha256sum .env | cut -d" " -f1')
          if [ "$now" != "$(cat /tmp/env.sha)" ]; then
            echo "::error::.env on the host changed during the deploy. This must never happen. Investigate."
            exit 1
          fi
          echo ".env unchanged."

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            --mount "type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock" \
            -e BIND_IP -e PG_DATA_DIR -e PG_SNAPSHOT_DIR -e BACKUP_DIR -e WEB_PORT -e WORKER_PORT \
            -w "$DEPLOY_DIR" "$DOCKER_IMAGE" \
            sh -c 'docker compose ps -a; echo; docker compose logs --no-color --tail=150' || true
